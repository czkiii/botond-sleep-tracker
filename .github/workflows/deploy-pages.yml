name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Full restore tests require node:sqlite.setAuthorizer (Node >=24.10).
          node-version: 24

      - name: Check repository hygiene
        run: npm run check:repository

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The account-enabled app runs on Cloudflare with its same-origin API.
      # This workflow publishes only the legacy link and local-backup entry.
      # Frontend/Worker checks still protect main in the separate CI workflow.
      - name: Build legacy entry
        run: node scripts/build-legacy-entry.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-entry-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
