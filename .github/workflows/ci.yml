name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/child-profile-v4

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Offline restore imports use node:sqlite's authorizer (Node >=24.10).
          node-version: 24

      - name: Check repository hygiene
        run: npm run check:repository

      - name: Install dependencies
        run: npm ci

      - name: Install Worker test dependencies
        run: npm --prefix worker ci

      - name: Audit locked frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare bundled mobile assets (no signing or upload)
        run: npm run native:sync

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm --prefix worker ci

      - name: Audit locked Worker dependencies
        run: npm --prefix worker audit --audit-level=moderate

      - name: Typecheck
        run: npm --prefix worker run typecheck

      - name: Package the identified staging Worker without deploying
        run: npm --prefix worker run deploy:staging -- --dry-run
